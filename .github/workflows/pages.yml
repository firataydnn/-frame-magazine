name: Publish FRAME
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate publishing script
        run: node --check scripts/build.mjs
      - name: Build all 572 HTML articles
        run: node scripts/build.mjs
      - name: Validate issue 02 generator
        run: node --check scripts/build-issue02.mjs
      - name: Generate dense FRAME newspaper edition
        run: node scripts/build-issue02.mjs
      - name: Validate FRAME output
        run: node scripts/verify-build.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public website after deployment
        run: |
          set -euo pipefail
          BASE="https://firataydnn.github.io/-frame-magazine"
          for endpoint in "/" "/tr/" "/tr/gazete/" "/tr/gundem/" "/assets/edition02.css"; do
            STATUS="000"
            for try in 1 2 3 4 5 6; do
              STATUS=$(curl --location --silent --show-error --output /tmp/frame-response --write-out '%{http_code}' --max-time 15 "$BASE$endpoint" || true)
              if [ "$STATUS" = "200" ]; then break; fi
              sleep 4
            done
            echo "$BASE$endpoint -> HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              head -c 200 /tmp/frame-response || true
              exit 1
            fi
            if [ "$endpoint" = "/tr/gazete/" ]; then
              grep -q "572 İÇERİĞİN TAMAMI" /tmp/frame-response
              echo "PASS: all-572 newspaper marker appears on deployed URL"
            fi
          done
